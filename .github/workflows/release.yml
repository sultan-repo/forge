name: Release Forge

on:
  workflow_run:
    workflows: [Validate Forge]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forge-release
  cancel-in-progress: false

jobs:
  eligibility:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      unreleased: ${{ steps.version.outputs.unreleased }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: version
        name: Check whether the validated version is unpublished
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$VALIDATED_SHA" ]]; then
            echo "A newer main commit awaits its own validation."
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | [.tag_name, .draft] | @tsv' > /tmp/forge-existing-releases.tsv
          if grep -Fxq $'v'"$version"$'\tfalse' /tmp/forge-existing-releases.tsv; then
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          elif grep -Fxq $'v'"$version"$'\ttrue' /tmp/forge-existing-releases.tsv; then
            echo "A draft for v$version already exists. Inspect the failed publication before retrying." >&2
            exit 2
          else
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: eligibility
    if: needs.eligibility.outputs.unreleased == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Forge
        run: python3 scripts/validate-skill-package.py

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a supported semantic version: $version" >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "asset=forge-skill-v$version.zip" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Refusing to replace an existing release." >&2
            exit 2
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists without a published release. Refusing to publish an unverified target." >&2
            exit 2
          fi

      - name: Build release archive
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        run: git archive --format=zip --prefix=forge/ HEAD -o "$ASSET"

      - name: Generate release notes from changelog
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ['VERSION']
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = rf'^##\s+{re.escape(version)}\s*$\n(.*?)(?=^##\s+|\Z)'
          match = re.search(pattern, text, flags=re.M | re.S)
          if not match:
              raise SystemExit(f'CHANGELOG.md has no section for {version}')
          body = match.group(1).strip()
          Path('/tmp/forge-release-notes.md').write_text(
              f'Forge v{version}\n\n{body}\n\nRelease commit: {os.environ["RELEASE_SHA"]}\n',
              encoding='utf-8',
          )
          PY

      - name: Create draft release with asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$RELEASE_SHA" ]]; then
            echo "Main advanced during packaging; release the newer commit after validation." >&2
            exit 2
          fi
          gh release create "$TAG" \
            "$ASSET#Forge skill package v$VERSION" \
            --repo "${{ github.repository }}" \
            --target "$RELEASE_SHA" \
            --title "Forge v$VERSION" \
            --notes-file /tmp/forge-release-notes.md \
            --draft --prerelease="$PRERELEASE"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest="$LATEST"

      - name: Verify published release and asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          max_attempts=12
          delay_seconds=5
          for attempt in $(seq 1 "$max_attempts"); do
            if gh release verify "$TAG" --repo "${{ github.repository }}" >/tmp/release-verify.log 2>&1 && \
               gh release verify-asset "$TAG" "$ASSET" --repo "${{ github.repository }}" >/tmp/asset-verify.log 2>&1; then
              cat /tmp/release-verify.log
              cat /tmp/asset-verify.log
              echo "Release and asset verification succeeded on attempt $attempt."
              exit 0
            fi
            echo "Release attestation not ready or verification incomplete (attempt $attempt/$max_attempts)."
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$delay_seconds"
            fi
          done
          cat /tmp/release-verify.log >&2 || true
          cat /tmp/asset-verify.log >&2 || true
          echo "Release verification did not succeed before the retry window closed." >&2
          exit 1
