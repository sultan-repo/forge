name: Release Forge v1.6.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.6.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated v1.6.0 commit
        uses: actions/checkout@v4
        with:
          ref: fd3bc0ebfe682d632aef4c0b2b37dfcddb38caaf
          fetch-depth: 0

      - name: Validate Forge
        run: python3 scripts/validate-skill-package.py

      - name: Build release archive
        run: git archive --format=zip --prefix=forge/ HEAD -o forge-skill-v1.6.0.zip

      - name: Write release notes
        run: |
          cat > /tmp/forge-release-notes.md <<'EOF'
          Forge v1.6.0 focuses on evidence, context efficiency, capability-first execution, safer bootstrap, and deterministic control.

          Highlights:
          - slimmer always-loaded SKILL.md core
          - capability-first routing with no model-name hardcoding
          - worked end-to-end control example
          - hardened remote bootstrap and release provenance guidance
          - Claude Code built-in integration reference
          - empirical benchmark protocol
          - optional deterministic completion guard
          - MIT license

          Release commit: fd3bc0ebfe682d632aef4c0b2b37dfcddb38caaf
          EOF

      - name: Publish immutable v1.6.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.6.0 >/dev/null 2>&1; then
            echo 'v1.6.0 release already exists; nothing to do.'
            exit 0
          fi
          gh release create v1.6.0 \
            forge-skill-v1.6.0.zip#'Forge skill package v1.6.0' \
            --repo '${{ github.repository }}' \
            --target fd3bc0ebfe682d632aef4c0b2b37dfcddb38caaf \
            --title 'Forge v1.6.0' \
            --notes-file /tmp/forge-release-notes.md \
            --latest
